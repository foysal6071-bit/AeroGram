
name: AeroGram Auto Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build AeroGram Audio + Video
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Extract ZIP
      - name: Extract AeroGram ZIP
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip zip

          test -f AeroGram-Calls-Fork.zip

          mkdir extracted
          unzip -q AeroGram-Calls-Fork.zip -d extracted

          PATCHER=$(find extracted -name patch_telegram.py | head -1)

          test -n "$PATCHER"

          mkdir -p scripts
          cp "$PATCHER" scripts/patch_telegram.py

          echo "ZIP extracted successfully"

      # 3. Free disk space
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true

          df -h /

      # 4. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Install SDK and NDK
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses

          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      # 7. Clone Telegram Source
      - name: Clone Telegram Android
        run: |
          git clone --depth 1 --recursive \
            --shallow-submodules \
            https://github.com/DrKLO/Telegram.git Telegram

      # 8. Patch AeroGram
      - name: Apply AeroGram Patch
        env:
          VARIANT: video
          APP_ID: ${{ secrets.TG_API_ID }}
          APP_HASH: ${{ secrets.TG_API_HASH }}
          APP_NAME: AeroGram
          SRC: Telegram
        run: |
          set -e

          python3 scripts/patch_telegram.py

          echo "Audio and Video call patch applied"

      # 9. Google Services (Optional)
      - name: Setup Google Services
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            echo "$GS" > Telegram/TMessagesProj_AppStandalone/google-services.json
            echo "Google services configured"
          else
            echo "Google services skipped"
          fi

      # 10. Prepare Signing Key
      - name: Prepare APK Signing Key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          if [ -n "$KS_B64" ]; then

            test -n "$KS_PASS_SECRET"
            test -n "$KS_ALIAS_SECRET"

            echo "$KS_B64" | base64 -d > release.jks

            echo "SIGN_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
            echo "SIGN_ALIAS=$KS_ALIAS_SECRET" >> "$GITHUB_ENV"

            echo "Using saved signing key"

          else

            PASS=$(openssl rand -hex 24)

            keytool -genkeypair \
              -keystore release.jks \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -alias aerogram \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AeroGram"

            echo "SIGN_PASS=$PASS" >> "$GITHUB_ENV"
            echo "SIGN_ALIAS=aerogram" >> "$GITHUB_ENV"

            echo "New signing key generated"

          fi

      # 11. Build APK
      - name: Build Universal APK
        working-directory: Telegram
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --max-workers=2 \
            :TMessagesProj_AppStandalone:assembleAfatStandalone

      # 12. Find APK
      - name: Prepare APK
        run: |
          set -e

          APK=$(find Telegram/TMessagesProj_AppStandalone/build/outputs/apk \
            -type f -name '*.apk' | head -1)

          test -n "$APK"

          cp "$APK" AeroGram-unsigned.apk

          echo "APK prepared"

      # 13. Optimize and Sign
      - name: Zipalign and Sign APK
        env:
          SIGN_PASS: ${{ env.SIGN_PASS }}
          SIGN_ALIAS: ${{ env.SIGN_ALIAS }}
        run: |
          set -e

          BT="$ANDROID_HOME/build-tools/36.0.0"

          "$BT/zipalign" -f -p 4 \
            AeroGram-unsigned.apk \
            AeroGram-aligned.apk

          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-pass env:SIGN_PASS \
            --ks-key-alias "$SIGN_ALIAS" \
            --key-pass env:SIGN_PASS \
            --out AeroGram.apk \
            AeroGram-aligned.apk

          "$BT/zipalign" -c -p 4 AeroGram.apk
          "$BT/apksigner" verify --verbose AeroGram.apk

          rm -f AeroGram-unsigned.apk AeroGram-aligned.apk

          ls -lh AeroGram.apk

      # 14. Upload Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AeroGram-Android
          path: AeroGram.apk
          if-no-files-found: error
          retention-days: 30

      # 15. GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aerogram-${{ github.run_number }}
          name: AeroGram Release #${{ github.run_number }}
          body: |
            # AeroGram Android

            Single universal APK.

            Features:
            - Private Chat
            - Audio Calling
            - Video Calling
            - Universal APK

            Unofficial Telegram-based Android client.
          files: AeroGram.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 16. Summary
      - name: Build Summary
        if: always()
        run: |
          echo "AeroGram build finished."
          ls -lh AeroGram.apk || true
