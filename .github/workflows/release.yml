
name: AeroGram Auto Build & Release

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build version
        required: true
        type: choice
        default: both
        options:
          - both
          - audio
          - video
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP Project
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip zip

          test -f AeroGram-Calls-Fork.zip

          mkdir extracted
          unzip -q AeroGram-Calls-Fork.zip -d extracted

          PATCHER=$(find extracted -name patch_telegram.py | head -1)

          test -n "$PATCHER"

          mkdir -p scripts
          cp "$PATCHER" scripts/patch_telegram.py

          echo "Project extracted successfully"

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and NDK
        run: |
          yes | sdkmanager --licenses

          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Prepare Signing Key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks

            test -n "$KS_PASS"
            test -n "$KS_ALIAS"

            echo "Using saved signing key"
          else
            PASS=$(openssl rand -hex 20)

            keytool -genkeypair \
              -keystore release.jks \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -alias aero \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AeroGram"

            echo "KS_PASS=$PASS" >> "$GITHUB_ENV"
            echo "KS_ALIAS=aero" >> "$GITHUB_ENV"

            echo "Temporary signing key created"
          fi

      - name: Build AeroGram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -e

          VARIANT="${VARIANT:-both}"

          if [ "$VARIANT" = "both" ]; then
            VARIANTS="audio video"
          else
            VARIANTS="$VARIANT"
          fi

          mkdir -p release

          for V in $VARIANTS; do

            echo "================================"
            echo "Building AeroGram: $V"
            echo "================================"

            rm -rf Telegram

            git clone --depth 1 --recursive \
              --shallow-submodules \
              https://github.com/DrKLO/Telegram.git Telegram

            export VARIANT="$V"
            export APP_ID="$TG_API_ID"
            export APP_HASH="$TG_API_HASH"
            export APP_NAME="AeroGram"
            export SRC="Telegram"

            python3 scripts/patch_telegram.py

            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              echo "$GOOGLE_SERVICES_JSON" \
                > Telegram/TMessagesProj_AppStandalone/google-services.json
            fi

            cd Telegram

            chmod +x gradlew

            ./gradlew --no-daemon --max-workers=2 \
              :TMessagesProj_AppStandalone:assembleAfatStandalone

            cd ..

            APK=$(find Telegram/TMessagesProj_AppStandalone/build/outputs/apk \
              -type f -name '*.apk' | head -1)

            test -n "$APK"

            BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

            "$BUILD_TOOLS/zipalign" -f -p 4 \
              "$APK" "release/AeroGram-$V-aligned.apk"

            if [ -n "$KS_B64" ]; then
              PASS="$KS_PASS"
              ALIAS="$KS_ALIAS"
            else
              PASS="$KS_PASS"
              ALIAS="$KS_ALIAS"
            fi

            "$BUILD_TOOLS/apksigner" sign \
              --ks release.jks \
              --ks-pass env:PASS \
              --ks-key-alias "$ALIAS" \
              --key-pass env:PASS \
              --out "release/AeroGram-$V.apk" \
              "release/AeroGram-$V-aligned.apk"

            "$BUILD_TOOLS/apksigner" verify \
              "release/AeroGram-$V.apk"

            rm "release/AeroGram-$V-aligned.apk"

            echo "AeroGram $V build completed"

            rm -rf Telegram

          done

          echo "All APK builds completed"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AeroGram-APKs
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aerogram-${{ github.run_number }}
          name: AeroGram Release #${{ github.run_number }}
          body: |
            # AeroGram Android

            Unofficial Telegram-based Android client.

            Included builds:
            - Audio Call Edition
            - Video Call Edition

            APKs are signed and zipaligned.
          files: release/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        if: always()
        run: |
          echo "AeroGram workflow completed."
          ls -lh release/ || true
